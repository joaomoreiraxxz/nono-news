<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
  <title>Admin — Nono News</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { overflow-x: hidden; }

    :root {
      --bg: #0a0e1a;
      --surface: #111827;
      --surface2: #1a2235;
      --border: rgba(255,255,255,0.08);
      --accent: #3b82f6;
      --accent2: #6366f1;
      --success: #10b981;
      --danger: #ef4444;
      --warning: #f59e0b;
      --text: #f1f5f9;
      --muted: #64748b;
      --sidebar-w: 240px;
      --bottom-nav-h: 64px;
    }

    body {
      font-family: 'Inter', sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      min-height: 100svh;
    }

    /* ========== LOGIN ========== */
    #login-page {
      min-height: 100vh;
      min-height: 100svh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      background:
        radial-gradient(ellipse at 30% 40%, rgba(59,130,246,0.15), transparent 60%),
        radial-gradient(ellipse at 80% 70%, rgba(99,102,241,0.1), transparent 50%),
        var(--bg);
    }

    .login-box {
      width: 100%;
      max-width: 400px;
      padding: 40px 32px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 24px;
      box-shadow: 0 40px 80px rgba(0,0,0,0.5);
      animation: fadeUp 0.6s cubic-bezier(0.16,1,0.3,1) forwards;
    }
    @keyframes fadeUp { from { opacity:0; transform: translateY(24px); } to { opacity:1; transform: translateY(0); } }

    .login-logo { width: 52px; height: 52px; margin: 0 auto 24px; display: block; }
    .login-box h1 { font-size: 1.4rem; font-weight: 700; text-align: center; margin-bottom: 4px; }
    .login-subtitle { text-align: center; color: var(--muted); font-size: 0.85rem; margin-bottom: 32px; }

    .form-group { margin-bottom: 16px; }
    .form-group label { display: block; font-size: 0.78rem; font-weight: 600; color: var(--muted); margin-bottom: 8px; letter-spacing: 0.5px; text-transform: uppercase; }
    .form-group input {
      width: 100%; padding: 14px 16px;
      background: var(--surface2); border: 1px solid var(--border);
      border-radius: 12px; color: var(--text); font-size: 1rem;
      font-family: inherit; outline: none;
      transition: border-color 0.2s, box-shadow 0.2s;
      -webkit-appearance: none;
    }
    .form-group input:focus { border-color: var(--accent); box-shadow: 0 0 0 3px rgba(59,130,246,0.15); }
    .form-group input::placeholder { color: var(--muted); }

    .btn-primary {
      width: 100%; padding: 16px;
      background: linear-gradient(135deg, var(--accent), var(--accent2));
      color: white; border: none; border-radius: 12px;
      font-size: 1rem; font-weight: 600; font-family: inherit;
      cursor: pointer; margin-top: 8px;
      transition: opacity 0.2s, transform 0.15s;
      -webkit-tap-highlight-color: transparent;
      touch-action: manipulation;
    }
    .btn-primary:active { opacity: 0.85; transform: scale(0.98); }
    .btn-primary:disabled { opacity: 0.5; cursor: not-allowed; }

    .login-msg { text-align: center; font-size: 0.85rem; margin-top: 12px; min-height: 20px; }
    .login-msg.error { color: var(--danger); }
    .login-msg.success { color: var(--success); }

    /* ========== ADMIN LAYOUT ========== */
    #login-page.hidden { display: none !important; }
    #admin-page { display: none; }
    #admin-page.visible {
      display: flex;
      min-height: 100vh;
      min-height: 100svh;
      position: relative;
      z-index: 10;
    }

    /* ===== SIDEBAR (desktop) ===== */
    .sidebar {
      width: var(--sidebar-w);
      background: var(--surface);
      border-right: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      position: fixed;
      top: 0; left: 0;
      height: 100vh;
      z-index: 100;
    }

    .sidebar-header {
      padding: 20px 16px;
      border-bottom: 1px solid var(--border);
    }
    .sidebar-logo { display: flex; align-items: center; gap: 10px; }
    .sidebar-logo img { width: 30px; height: 30px; object-fit: contain; }
    .sidebar-logo-text span { font-weight: 700; font-size: 0.95rem; display: block; }
    .sidebar-badge {
      font-size: 0.62rem; background: var(--accent);
      color: white; padding: 2px 6px; border-radius: 99px;
      font-weight: 600; display: inline-block; margin-top: 2px;
    }
    .sidebar-sub { font-size: 0.68rem; color: var(--muted); }

    .sidebar-nav { flex: 1; padding: 12px 8px; overflow-y: auto; }
    .nav-section { margin-bottom: 6px; }
    .nav-label {
      font-size: 0.68rem; font-weight: 700; color: var(--muted);
      text-transform: uppercase; letter-spacing: 1px;
      padding: 0 8px; margin-bottom: 4px; display: block;
    }
    .nav-item {
      display: flex; align-items: center; gap: 10px;
      padding: 10px 12px; border-radius: 10px;
      color: var(--muted); font-size: 0.86rem; font-weight: 500;
      cursor: pointer; transition: all 0.2s;
      border: none; background: none; width: 100%; text-align: left;
      -webkit-tap-highlight-color: transparent;
      touch-action: manipulation;
    }
    .nav-item:hover { background: var(--surface2); color: var(--text); }
    .nav-item.active { background: rgba(59,130,246,0.15); color: var(--accent); }
    .nav-item svg { width: 18px; height: 18px; flex-shrink: 0; }

    .sidebar-footer {
      padding: 12px 8px;
      border-top: 1px solid var(--border);
    }
    .user-info { display: flex; align-items: center; gap: 10px; padding: 8px 10px; }
    .user-avatar {
      width: 32px; height: 32px; border-radius: 50%;
      background: linear-gradient(135deg, var(--accent), var(--accent2));
      display: flex; align-items: center; justify-content: center;
      font-weight: 700; font-size: 0.82rem; flex-shrink: 0;
    }
    .user-name { font-size: 0.82rem; font-weight: 600; }
    .user-role { font-size: 0.7rem; color: var(--muted); }
    .btn-logout {
      width: 100%; padding: 10px;
      background: transparent; border: 1px solid var(--border);
      border-radius: 10px; color: var(--muted);
      font-family: inherit; font-size: 0.82rem; cursor: pointer;
      transition: all 0.2s; margin-top: 6px;
      touch-action: manipulation;
    }
    .btn-logout:hover, .btn-logout:active {
      background: rgba(239,68,68,0.1);
      border-color: var(--danger); color: var(--danger);
    }

    /* ===== MAIN ===== */
    .main {
      margin-left: var(--sidebar-w);
      flex: 1;
      min-height: 100vh;
      min-height: 100svh;
    }

    .topbar {
      padding: 16px 24px;
      border-bottom: 1px solid var(--border);
      display: flex; align-items: center; justify-content: space-between;
      background: var(--surface);
      position: sticky; top: 0; z-index: 50;
    }
    .topbar-title { font-size: 1.1rem; font-weight: 700; }
    .topbar-link {
      color: var(--muted); font-size: 0.8rem;
      text-decoration: none; display: flex; align-items: center; gap: 6px;
    }

    .content { padding: 24px; }

    /* ===== BOTTOM NAV (mobile) ===== */
    .bottom-nav {
      display: none;
      position: fixed;
      bottom: 0; left: 0; right: 0;
      height: var(--bottom-nav-h);
      background: var(--surface);
      border-top: 1px solid var(--border);
      z-index: 200;
    }
    .bottom-nav-inner {
      display: flex;
      align-items: stretch;
      height: 100%;
    }
    .bottom-nav-item {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 4px;
      border: none;
      background: none;
      color: var(--muted);
      font-family: inherit;
      font-size: 0.65rem;
      font-weight: 600;
      cursor: pointer;
      transition: color 0.2s, background 0.2s;
      -webkit-tap-highlight-color: transparent;
      touch-action: manipulation;
      padding: 0;
    }
    .bottom-nav-item.active { color: var(--accent); }
    .bottom-nav-item:active { background: rgba(255,255,255,0.05); }
    .bottom-nav-item svg { width: 22px; height: 22px; }

    /* ===== PANELS ===== */
    .panel { display: none; }
    .panel.active { display: block; animation: fadeUp 0.3s ease; }

    /* ===== STATS GRID ===== */
    .stats-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
      gap: 16px;
      margin-bottom: 24px;
    }
    .stat-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 20px;
      position: relative;
      overflow: hidden;
    }
    .stat-card::before {
      content: '';
      position: absolute; top: 0; left: 0; right: 0; height: 3px;
      background: linear-gradient(90deg, var(--accent), var(--accent2));
    }
    .stat-icon {
      width: 40px; height: 40px; border-radius: 10px;
      display: flex; align-items: center; justify-content: center;
      margin-bottom: 12px; font-size: 1.2rem;
    }
    .stat-icon.blue { background: rgba(59,130,246,0.15); color: var(--accent); }
    .stat-icon.purple { background: rgba(99,102,241,0.15); color: var(--accent2); }
    .stat-icon.green { background: rgba(16,185,129,0.15); color: var(--success); }
    .stat-icon.yellow { background: rgba(245,158,11,0.15); color: var(--warning); }
    .stat-value { font-size: 1.8rem; font-weight: 800; line-height: 1; margin-bottom: 4px; }
    .stat-label { font-size: 0.78rem; color: var(--muted); font-weight: 500; }

    /* ===== TABLE CARD ===== */
    .table-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 14px;
      overflow: hidden;
      margin-bottom: 16px;
    }
    .table-header {
      padding: 16px 20px;
      border-bottom: 1px solid var(--border);
      display: flex; align-items: center; justify-content: space-between;
    }
    .table-header h3 { font-size: 0.95rem; font-weight: 700; }

    /* Table — scroll horizontal no mobile */
    .table-wrap { overflow-x: auto; -webkit-overflow-scrolling: touch; }
    table { width: 100%; border-collapse: collapse; min-width: 400px; }
    th {
      padding: 10px 16px;
      text-align: left; font-size: 0.72rem; font-weight: 600;
      color: var(--muted); text-transform: uppercase; letter-spacing: 0.5px;
      border-bottom: 1px solid var(--border); background: var(--surface2);
      white-space: nowrap;
    }
    td {
      padding: 12px 16px; font-size: 0.85rem;
      border-bottom: 1px solid var(--border); vertical-align: middle;
    }
    tr:last-child td { border-bottom: none; }

    .badge {
      display: inline-flex; align-items: center; gap: 4px;
      padding: 3px 9px; border-radius: 99px;
      font-size: 0.72rem; font-weight: 600;
    }
    .badge-blue { background: rgba(59,130,246,0.15); color: var(--accent); }
    .badge-yellow { background: rgba(245,158,11,0.15); color: var(--warning); }
    .badge-gray { background: rgba(100,116,139,0.15); color: var(--muted); }
    .stars { color: var(--warning); }

    .btn-danger {
      padding: 7px 12px;
      background: rgba(239,68,68,0.1); border: 1px solid rgba(239,68,68,0.2);
      color: var(--danger); border-radius: 8px;
      font-size: 0.78rem; font-weight: 600;
      cursor: pointer; font-family: inherit;
      transition: all 0.2s;
      white-space: nowrap;
      touch-action: manipulation;
      -webkit-tap-highlight-color: transparent;
    }
    .btn-danger:hover, .btn-danger:active { background: rgba(239,68,68,0.2); }

    /* ===== FORM ===== */
    .form-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 24px 20px;
    }
    .form-card h3 {
      font-size: 0.95rem; font-weight: 700;
      margin-bottom: 20px; padding-bottom: 14px;
      border-bottom: 1px solid var(--border);
    }

    .switch-group { display: flex; gap: 8px; margin-bottom: 18px; }
    .switch-btn {
      flex: 1; padding: 11px 8px; border-radius: 10px;
      border: 1px solid var(--border); background: transparent;
      color: var(--muted); font-family: inherit; font-weight: 600;
      font-size: 0.85rem; cursor: pointer; transition: all 0.2s;
      touch-action: manipulation; -webkit-tap-highlight-color: transparent;
    }
    .switch-btn.active {
      background: rgba(59,130,246,0.15);
      color: var(--accent); border-color: rgba(59,130,246,0.3);
    }

    .form-field { margin-bottom: 16px; }
    .form-field label {
      display: block; font-size: 0.75rem; font-weight: 600;
      color: var(--muted); margin-bottom: 7px;
      text-transform: uppercase; letter-spacing: 0.5px;
    }
    .form-field input, .form-field textarea, .form-field select {
      width: 100%; padding: 12px 14px;
      background: var(--surface2); border: 1px solid var(--border);
      border-radius: 10px; color: var(--text);
      font-size: 1rem; font-family: inherit; outline: none;
      transition: border-color 0.2s, box-shadow 0.2s;
      -webkit-appearance: none;
    }
    .form-field input:focus, .form-field textarea:focus, .form-field select:focus {
      border-color: var(--accent); box-shadow: 0 0 0 3px rgba(59,130,246,0.12);
    }
    .form-field textarea { min-height: 90px; resize: vertical; }
    .form-field select option { background: var(--surface); }
    .form-field input::placeholder, .form-field textarea::placeholder { color: var(--muted); }

    .btn-publish {
      width: 100%; padding: 14px;
      background: linear-gradient(135deg, var(--accent), var(--accent2));
      color: white; border: none; border-radius: 12px;
      font-size: 0.95rem; font-weight: 700; font-family: inherit;
      cursor: pointer; transition: opacity 0.2s, transform 0.15s;
      margin-top: 4px;
      touch-action: manipulation; -webkit-tap-highlight-color: transparent;
    }
    .btn-publish:active { opacity: 0.85; transform: scale(0.98); }
    .btn-publish:disabled { opacity: 0.5; cursor: not-allowed; }

    .form-msg { font-size: 0.85rem; margin-top: 10px; min-height: 18px; }
    .form-msg.error { color: var(--danger); }
    .form-msg.success { color: var(--success); }

    /* ===== EMPTY STATE ===== */
    .empty { text-align: center; padding: 48px 20px; color: var(--muted); }
    .empty-icon { font-size: 2.5rem; margin-bottom: 10px; }
    .empty p { font-size: 0.88rem; }

    /* ===== LOADING ===== */
    .loading { text-align: center; padding: 32px; color: var(--muted); font-size: 0.88rem; }

    /* ===== SCROLLBAR ===== */
    ::-webkit-scrollbar { width: 5px; height: 5px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 99px; }

    /* ========== RESPONSIVE — MOBILE ========== */
    @media (max-width: 768px) {
      /* Sidebar some no mobile */
      .sidebar { display: none !important; }

      /* Main ocupa tela toda */
      .main {
        margin-left: 0 !important;
        padding-bottom: var(--bottom-nav-h);
      }

      /* Bottom nav aparece */
      .bottom-nav { display: flex !important; }

      /* Topbar mobile */
      .topbar { padding: 14px 16px !important; }
      .topbar-title { font-size: 1rem !important; }

      /* Content */
      .content { padding: 16px !important; }

      /* Stats grid — 2 colunas no mobile */
      .stats-grid {
        grid-template-columns: repeat(2, 1fr) !important;
        gap: 12px !important;
        margin-bottom: 16px !important;
      }
      .stat-card { padding: 16px 14px !important; }
      .stat-value { font-size: 1.5rem !important; }
      .stat-label { font-size: 0.72rem !important; }
      .stat-icon { width: 34px !important; height: 34px !important; margin-bottom: 10px !important; }

      /* Formulário */
      .form-card { padding: 18px 16px !important; border-radius: 14px !important; }
      .switch-btn { font-size: 0.8rem !important; padding: 10px 6px !important; }

      /* Login */
      .login-box { padding: 32px 24px !important; border-radius: 20px !important; }
    }
  </style>
</head>
<body>

<!-- ========== LOGIN ========== -->
<div id="login-page">
  <div class="login-box">
    <img src="/assets/logo.png" alt="Logo" class="login-logo">
    <h1>Painel Admin</h1>
    <p class="login-subtitle">Nono News — Escola Adventista</p>
    <form id="login-form">
      <div class="form-group">
        <label for="email">E-mail</label>
        <input type="email" id="email" placeholder="admin@escola.com" required autocomplete="email" inputmode="email">
      </div>
      <div class="form-group">
        <label for="password">Senha</label>
        <input type="password" id="password" placeholder="••••••••" required autocomplete="current-password">
      </div>
      <button type="submit" class="btn-primary" id="login-btn">Entrar no Painel</button>
    </form>
    <p class="login-msg" id="login-msg"></p>
  </div>
</div>

<!-- ========== ADMIN ========== -->
<div id="admin-page">

  <!-- Sidebar (desktop) -->
  <aside class="sidebar">
    <div class="sidebar-header">
      <div class="sidebar-logo">
        <img src="/assets/logo.png" alt="Logo">
        <div class="sidebar-logo-text">
          <span>Nono News</span>
          <span class="sidebar-badge">Admin</span>
          <div class="sidebar-sub">Escola Adventista</div>
        </div>
      </div>
    </div>
    <nav class="sidebar-nav">
      <div class="nav-section">
        <span class="nav-label">Principal</span>
        <button class="nav-item active" onclick="showPanel('dashboard')" id="nav-dashboard">
          <svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></svg>
          Dashboard
        </button>
      </div>
      <div class="nav-section">
        <span class="nav-label">Conteúdo</span>
        <button class="nav-item" onclick="showPanel('publish')" id="nav-publish">
          <svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/></svg>
          Publicar
        </button>
        <button class="nav-item" onclick="showPanel('articles')" id="nav-articles">
          <svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/></svg>
          Artigos
        </button>
      </div>
      <div class="nav-section">
        <span class="nav-label">Comunidade</span>
        <button class="nav-item" onclick="showPanel('ratings')" id="nav-ratings">
          <svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/></svg>
          Avaliações
        </button>
      </div>
    </nav>
    <div class="sidebar-footer">
      <div class="user-info">
        <div class="user-avatar" id="user-avatar">A</div>
        <div>
          <div class="user-name" id="user-name">Admin</div>
          <div class="user-role">Super Admin</div>
        </div>
      </div>
      <button class="btn-logout" onclick="logout()">Sair do Painel</button>
    </div>
  </aside>

  <!-- Main -->
  <main class="main">
    <div class="topbar">
      <span class="topbar-title" id="topbar-title">Dashboard</span>
      <a href="/" target="_blank" class="topbar-link">
        <svg width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/><polyline points="15 3 21 3 21 9"/><line x1="10" y1="14" x2="21" y2="3"/></svg>
        Ver Site
      </a>
    </div>

    <div class="content">

      <!-- DASHBOARD -->
      <div class="panel active" id="panel-dashboard">
        <div class="stats-grid" id="stats-grid">
          <div class="loading">Carregando...</div>
        </div>
        <div class="table-card">
          <div class="table-header"><h3>📰 Últimas Notícias</h3></div>
          <div class="table-wrap" id="recent-articles"><div class="loading">Carregando...</div></div>
        </div>
      </div>

      <!-- PUBLICAR -->
      <div class="panel" id="panel-publish">
        <div class="form-card">
          <h3>✏️ Publicar Conteúdo</h3>
          <div class="switch-group">
            <button class="switch-btn active" id="type-news" onclick="setType('news')">📰 Notícia</button>
            <button class="switch-btn" id="type-featured" onclick="setType('featured')">⭐ Destaque</button>
          </div>
          <form id="publish-form">
            <div class="form-field">
              <label>Título *</label>
              <input type="text" id="p-title" placeholder="Título da matéria..." required>
            </div>
            <div class="form-field">
              <label>Resumo</label>
              <textarea id="p-summary" placeholder="Descrição breve..."></textarea>
            </div>
            <div class="form-field">
              <label>Categoria</label>
              <select id="p-category">
                <option value="">Sem categoria</option>
                <option value="Eventos">Eventos</option>
                <option value="Esportes">Esportes</option>
                <option value="Educação">Educação</option>
                <option value="Inovação">Inovação</option>
                <option value="Valores">Valores</option>
                <option value="Saúde">Saúde</option>
                <option value="Cultura">Cultura</option>
              </select>
            </div>
            <div class="form-field">
              <label>URL da Imagem</label>
              <input type="url" id="p-image" placeholder="https://" inputmode="url">
            </div>
            <button type="submit" class="btn-publish" id="publish-btn">Publicar</button>
          </form>
          <p class="form-msg" id="publish-msg"></p>
        </div>
      </div>

      <!-- ARTIGOS -->
      <div class="panel" id="panel-articles">
        <div class="table-card">
          <div class="table-header">
            <h3>📰 Artigos</h3>
          </div>
          <div class="table-wrap" id="articles-table"><div class="loading">Carregando...</div></div>
        </div>
      </div>

      <!-- AVALIAÇÕES -->
      <div class="panel" id="panel-ratings">
        <div class="stats-grid" style="grid-template-columns:repeat(2,1fr)">
          <div class="stat-card">
            <div class="stat-icon yellow">⭐</div>
            <div class="stat-value" id="avg-rating">—</div>
            <div class="stat-label">Média Geral</div>
          </div>
          <div class="stat-card">
            <div class="stat-icon blue">💬</div>
            <div class="stat-value" id="total-ratings">—</div>
            <div class="stat-label">Total</div>
          </div>
        </div>
        <div class="table-card">
          <div class="table-header"><h3>⭐ Avaliações</h3></div>
          <div class="table-wrap" id="ratings-table"><div class="loading">Carregando...</div></div>
        </div>
      </div>

    </div><!-- /content -->
  </main>

  <!-- Bottom Nav (mobile) -->
  <nav class="bottom-nav">
    <div class="bottom-nav-inner">
      <button class="bottom-nav-item active" id="bnav-dashboard" onclick="showPanel('dashboard')">
        <svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></svg>
        Início
      </button>
      <button class="bottom-nav-item" id="bnav-publish" onclick="showPanel('publish')">
        <svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="16"/><line x1="8" y1="12" x2="16" y2="12"/></svg>
        Publicar
      </button>
      <button class="bottom-nav-item" id="bnav-articles" onclick="showPanel('articles')">
        <svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/></svg>
        Artigos
      </button>
      <button class="bottom-nav-item" id="bnav-ratings" onclick="showPanel('ratings')">
        <svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/></svg>
        Avaliações
      </button>
      <button class="bottom-nav-item" id="bnav-logout" onclick="logout()">
        <svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
        Sair
      </button>
    </div>
  </nav>

</div><!-- /admin-page -->

<script>
  const TOKEN_KEY = 'nono_admin_token';
  const PANELS = ['dashboard','publish','articles','ratings'];
  const PANEL_TITLES = { dashboard:'Dashboard', publish:'Publicar', articles:'Artigos', ratings:'Avaliações' };

  function getToken() { return localStorage.getItem(TOKEN_KEY); }
  function isLoggedIn() { return !!getToken(); }

  async function apiFetch(path, opts = {}) {
    const res = await fetch('/api' + path, {
      headers: { 'Content-Type': 'application/json', Authorization: 'Bearer ' + getToken() },
      ...opts
    });
    const json = await res.json();
    if (!res.ok) throw new Error(json.error || 'Erro');
    return json;
  }

  /* ===== LOGIN ===== */
  document.getElementById('login-form').addEventListener('submit', async (e) => {
    e.preventDefault();
    const msg = document.getElementById('login-msg');
    const btn = document.getElementById('login-btn');
    btn.textContent = 'Entrando...'; btn.disabled = true;
    try {
      const data = await fetch('/api/auth/login', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          email: document.getElementById('email').value,
          password: document.getElementById('password').value
        })
      });
      const json = await data.json();
      if (!data.ok) throw new Error(json.error);
      localStorage.setItem(TOKEN_KEY, json.token);
      if (json.user) setUserInfo(json.user);
      msg.className = 'login-msg success'; msg.textContent = '✓ Bem-vindo!';
      setTimeout(() => showAdmin(), 700);
    } catch(err) {
      msg.className = 'login-msg error'; msg.textContent = err.message || 'Credenciais inválidas.';
      btn.textContent = 'Entrar no Painel'; btn.disabled = false;
    }
  });

  function setUserInfo(user) {
    document.getElementById('user-name').textContent = user.name || 'Admin';
    document.getElementById('user-avatar').textContent = (user.name || 'A')[0].toUpperCase();
  }

  function showAdmin() {
    const loginEl = document.getElementById('login-page');
    if (loginEl) loginEl.remove();
    document.getElementById('admin-page').classList.add('visible');
    loadDashboard();
  }

  window.logout = function() {
    if (!confirm('Sair do painel?')) return;
    localStorage.removeItem(TOKEN_KEY);
    location.reload();
  };

  /* ===== NAVIGATION ===== */
  window.showPanel = function(name) {
    PANELS.forEach(p => {
      document.getElementById('panel-' + p).classList.toggle('active', p === name);
      const sNav = document.getElementById('nav-' + p);
      const bNav = document.getElementById('bnav-' + p);
      if (sNav) sNav.classList.toggle('active', p === name);
      if (bNav) bNav.classList.toggle('active', p === name);
    });
    document.getElementById('topbar-title').textContent = PANEL_TITLES[name] || name;
    window.scrollTo({ top: 0, behavior: 'smooth' });
    if (name === 'dashboard') loadDashboard();
    if (name === 'articles') loadArticles();
    if (name === 'ratings') loadRatings();
  };

  /* ===== PUBLISH TYPE ===== */
  let publishType = 'news';
  window.setType = function(t) {
    publishType = t;
    document.getElementById('type-news').classList.toggle('active', t === 'news');
    document.getElementById('type-featured').classList.toggle('active', t === 'featured');
  };

  /* ===== HELPERS ===== */
  function stars(n) { return '★'.repeat(n) + '☆'.repeat(5 - n); }

  /* ===== DASHBOARD ===== */
  async function loadDashboard() {
    try {
      const [featured, articles, ratings] = await Promise.all([
        apiFetch('/articles/featured'),
        apiFetch('/articles'),
        apiFetch('/ratings?limit=100')
      ]);
      const avg = ratings.length
        ? (ratings.reduce((a, r) => a + r.stars, 0) / ratings.length).toFixed(1)
        : '—';

      document.getElementById('stats-grid').innerHTML = `
        <div class="stat-card"><div class="stat-icon blue">📰</div><div class="stat-value">${articles.length}</div><div class="stat-label">Notícias</div></div>
        <div class="stat-card"><div class="stat-icon purple">⭐</div><div class="stat-value">${featured.length}</div><div class="stat-label">Destaques</div></div>
        <div class="stat-card"><div class="stat-icon green">💬</div><div class="stat-value">${ratings.length}</div><div class="stat-label">Avaliações</div></div>
        <div class="stat-card"><div class="stat-icon yellow">⭐</div><div class="stat-value">${avg}</div><div class="stat-label">Média</div></div>
      `;

      const all = [...featured, ...articles].slice(0, 5);
      if (!all.length) {
        document.getElementById('recent-articles').innerHTML =
          '<div class="empty"><div class="empty-icon">📭</div><p>Nenhum artigo ainda.</p></div>';
        return;
      }
      document.getElementById('recent-articles').innerHTML = `
        <table>
          <thead><tr><th>Título</th><th>Tipo</th><th>Data</th></tr></thead>
          <tbody>${all.map(a => `<tr>
            <td style="max-width:200px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${a.title}</td>
            <td>${a.isFeatured ? '<span class="badge badge-yellow">⭐</span>' : '<span class="badge badge-gray">📰</span>'}</td>
            <td style="color:var(--muted);font-size:0.78rem;white-space:nowrap">${a.date || '—'}</td>
          </tr>`).join('')}</tbody>
        </table>`;
    } catch(err) {
      document.getElementById('stats-grid').innerHTML = `<p style="color:var(--danger);padding:16px;font-size:0.85rem">Erro: ${err.message}</p>`;
    }
  }

  /* ===== ARTICLES ===== */
  async function loadArticles() {
    const el = document.getElementById('articles-table');
    el.innerHTML = '<div class="loading">Carregando...</div>';
    try {
      const [featured, articles] = await Promise.all([
        apiFetch('/articles/featured'), apiFetch('/articles')
      ]);
      const all = [...featured, ...articles];
      if (!all.length) {
        el.innerHTML = '<div class="empty"><div class="empty-icon">📭</div><p>Nenhum artigo publicado.</p></div>';
        return;
      }
      el.innerHTML = `
        <table>
          <thead><tr><th>Título</th><th>Tipo</th><th>Ação</th></tr></thead>
          <tbody>${all.map(a => `<tr>
            <td style="max-width:160px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${a.title}</td>
            <td>${a.isFeatured ? '<span class="badge badge-yellow">Destaque</span>' : '<span class="badge badge-gray">Notícia</span>'}</td>
            <td><button class="btn-danger" onclick="deleteArticle(${a.id})">Excluir</button></td>
          </tr>`).join('')}
          </tbody>
        </table>`;
    } catch(err) {
      el.innerHTML = `<p style="padding:20px;color:var(--danger)">${err.message}</p>`;
    }
  }

  window.deleteArticle = async function(id) {
    if (!confirm('Excluir este artigo?')) return;
    try {
      await apiFetch('/articles/' + id, { method: 'DELETE' });
      loadArticles();
    } catch(err) { alert(err.message); }
  };

  /* ===== RATINGS ===== */
  async function loadRatings() {
    const el = document.getElementById('ratings-table');
    el.innerHTML = '<div class="loading">Carregando...</div>';
    try {
      const [ratings, stats] = await Promise.all([
        apiFetch('/ratings'), apiFetch('/ratings/stats')
      ]);
      document.getElementById('avg-rating').textContent = stats.average || '—';
      document.getElementById('total-ratings').textContent = stats.total;

      if (!ratings.length) {
        el.innerHTML = '<div class="empty"><div class="empty-icon">⭐</div><p>Nenhuma avaliação ainda.</p></div>';
        return;
      }
      el.innerHTML = `
        <table>
          <thead><tr><th>Nome</th><th>Nota</th><th>Comentário</th><th>Ação</th></tr></thead>
          <tbody>${ratings.map(r => `<tr>
            <td style="white-space:nowrap"><strong>${r.name}</strong></td>
            <td><span class="stars">${stars(r.stars)}</span></td>
            <td style="max-width:140px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--muted);font-size:0.8rem">${r.comment || '—'}</td>
            <td><button class="btn-danger" onclick="deleteRating(${r.id})">Excluir</button></td>
          </tr>`).join('')}
          </tbody>
        </table>`;
    } catch(err) {
      el.innerHTML = `<p style="padding:20px;color:var(--danger)">${err.message}</p>`;
    }
  }

  window.deleteRating = async function(id) {
    if (!confirm('Excluir esta avaliação?')) return;
    try {
      await apiFetch('/ratings/' + id, { method: 'DELETE' });
      loadRatings();
    } catch(err) { alert(err.message); }
  };

  /* ===== PUBLISH ===== */
  document.getElementById('publish-form').addEventListener('submit', async (e) => {
    e.preventDefault();
    const msg = document.getElementById('publish-msg');
    const btn = document.getElementById('publish-btn');
    btn.textContent = 'Publicando...'; btn.disabled = true;
    try {
      await apiFetch('/articles', {
        method: 'POST',
        body: JSON.stringify({
          title: document.getElementById('p-title').value,
          summary: document.getElementById('p-summary').value,
          category: document.getElementById('p-category').value,
          image: document.getElementById('p-image').value,
          isFeatured: publishType === 'featured',
        })
      });
      msg.className = 'form-msg success';
      msg.textContent = publishType === 'featured' ? '⭐ Destaque publicado!' : '📰 Notícia publicada!';
      e.target.reset();
    } catch(err) {
      msg.className = 'form-msg error'; msg.textContent = err.message;
    }
    btn.textContent = 'Publicar'; btn.disabled = false;
    setTimeout(() => { msg.textContent = ''; }, 4000);
  });

  /* ===== INIT ===== */
  if (isLoggedIn()) {
    showAdmin();
    fetch('/api/auth/me', { headers: { Authorization: 'Bearer ' + getToken() } })
      .then(r => r.json()).then(d => { if (d.user) setUserInfo(d.user); }).catch(() => {});
  }
</script>
</body>
</html>
